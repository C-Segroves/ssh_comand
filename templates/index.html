<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LAN Command Runner</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
            background: #f5f5f5;
        }
        h1, h2 { color: #333; }
        input, button {
            padding: 10px;
            margin: 6px 4px 6px 0;
            font-size: 16px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover { background: #45a049; }

        /* Tabs – improved contrast */
        .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            background-color: #e8e8e8;          /* slightly darker than before */
            margin-bottom: 16px;
            border-radius: 4px 4px 0 0;
        }
        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 18px;
            transition: 0.3s;
            font-size: 17px;
            color: #000000;                     /* black text – main fix */
            font-weight: 500;
        }
        .tab button:hover { background-color: #ddd; }
        .tab button.active {
            background-color: #d0d0d0;
            border-bottom: 3px solid #4CAF50;
        }

        .tabcontent {
            display: none;
            padding: 20px;
            border: 1px solid #ccc;
            border-top: none;
            background: white;
            border-radius: 0 0 4px 4px;
        }

        .host-box {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 14px;
            margin: 12px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }
        pre {
            white-space: pre-wrap;
            max-height: 320px;
            overflow-y: auto;
            background: #f8f8f8;
            padding: 12px;
            border-radius: 4px;
            margin: 10px 0 0;
            font-family: 'Courier New', Courier, monospace;
        }
        .error { color: #c00; font-weight: bold; }

        #all-results, .single-result {
            margin-top: 20px;
        }

        /* Host selector */
        #host-selector {
            margin: 16px 0;
            padding: 12px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .host-item {
            margin: 8px 0;
        }
        .host-item label {
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>
<body>

<h1>LAN Command Runner</h1>

<div class="tab" id="tabs"></div>

<!-- All Hosts Tab Content -->
<div id="all" class="tabcontent">
    <h2>All Hosts – Register & Selective Commands</h2>

    <h3>Register New Host</h3>
    <input id="name"     placeholder="Friendly name (e.g. bedroom-pc)" />
    <input id="ip"       placeholder="IP address (e.g. 192.168.1.45)" />
    <input id="username" placeholder="SSH username" value="chris" />
    <input id="password" type="password" placeholder="Password (only if key not set up yet)" />
    <button onclick="registerHost()">Register</button>

    <h3>Run Command on Selected Hosts</h3>
    <div id="host-selector">
        <!-- Checkboxes will be populated here -->
    </div>

    <input id="all-command" placeholder="Command (e.g. uptime, df -h, free -h)" style="width: 600px; margin-top: 12px;" />
    <button onclick="runOnSelected()">Execute on Selected</button>

    <div id="all-results"></div>
</div>

<script>
// Tab switching
function openTab(evt, tabName) {
    var i, tabcontent, tablinks;
    tabcontent = document.getElementsByClassName("tabcontent");
    for (i = 0; i < tabcontent.length; i++) {
        tabcontent[i].style.display = "none";
    }
    tablinks = document.getElementsByClassName("tablinks");
    for (i = 0; i < tablinks.length; i++) {
        tablinks[i].className = tablinks[i].className.replace(" active", "");
    }
    document.getElementById(tabName).style.display = "block";
    if (evt) evt.currentTarget.className += " active";
}

// Refresh hosts + tabs + checkboxes
const socket = io();

let currentHosts = [];

function refreshHostsAndTabs() {
    fetch('/hosts')
        .then(r => r.json())
        .then(hosts => {
            currentHosts = hosts;

            // Tabs
            const tabBar = document.getElementById('tabs');
            tabBar.innerHTML = '';

            const allBtn = document.createElement('button');
            allBtn.className = 'tablinks active';
            allBtn.textContent = 'All Hosts';
            allBtn.onclick = (e) => openTab(e, 'all');
            tabBar.appendChild(allBtn);

            hosts.forEach(host => {
                const btn = document.createElement('button');
                btn.className = 'tablinks';
                btn.textContent = host;
                btn.onclick = (e) => openTab(e, `tab-${host}`);
                tabBar.appendChild(btn);

                if (!document.getElementById(`tab-${host}`)) {
                    const div = document.createElement('div');
                    div.id = `tab-${host}`;
                    div.className = 'tabcontent';
                    div.innerHTML = `
                        <h2>Host: ${host}</h2>
                        <input id="cmd-${host}" placeholder="Command for ${host} only" style="width: 600px;" />
                        <button onclick="runOnSingle('${host}')">Run on this host</button>
                        <div id="result-${host}" class="single-result"></div>
                    `;
                    document.body.appendChild(div);
                }
            });

            // Host selector checkboxes
            const selector = document.getElementById('host-selector');
            selector.innerHTML = '';
            if (hosts.length === 0) {
                selector.innerHTML = '<p style="color:#666;">No hosts registered yet.</p>';
            } else {
                hosts.forEach(host => {
                    const div = document.createElement('div');
                    div.className = 'host-item';
                    div.innerHTML = `
                        <input type="checkbox" id="chk-${host}" value="${host}" checked>
                        <label for="chk-${host}">${host}</label>
                    `;
                    selector.appendChild(div);
                });
            }

            openTab(null, 'all');
        });
}

// Register
function registerHost() {
    const name     = document.getElementById('name').value.trim();
    const ip       = document.getElementById('ip').value.trim();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!name || !ip || !username) {
        alert("Please fill name, IP and username");
        return;
    }

    fetch('/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ name, ip, username, password })
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) alert("Error: " + data.error);
        else {
            alert(data.message);
            document.getElementById('password').value = '';
            refreshHostsAndTabs();
        }
    })
    .catch(err => alert("Request failed: " + err));
}

// Run on selected hosts
function runOnSelected() {
    const cmd = document.getElementById('all-command').value.trim();
    if (!cmd) return alert("Enter a command");

    const selected = currentHosts.filter(host => 
        document.getElementById(`chk-${host}`).checked
    );

    if (selected.length === 0) return alert("Select at least one host");

    socket.emit('execute_command', { 
        command: cmd, 
        target: 'selected', 
        hosts: selected 
    });
}

// Run on single host
function runOnSingle(host) {
    const cmd = document.getElementById(`cmd-${host}`).value.trim();
    if (!cmd) return alert("Enter a command for " + host);
    socket.emit('execute_command', { command: cmd, target: host });
}

// Receive results
socket.on('command_results', (results) => {
    if (results._meta && results._meta.target === 'selected') {
        const container = document.getElementById('all-results');
        container.innerHTML = '';
        Object.entries(results).forEach(([name, data]) => {
            if (name === '_meta') return;
            const box = document.createElement('div');
            box.className = 'host-box';
            box.innerHTML = `<strong>${name} (${data.ip})</strong><pre>${data.output || ''}${data.error ? '\n<span class="error">Error: ' + data.error + '</span>' : ''}</pre>`;
            container.appendChild(box);
        });
    } else if (results._meta && results._meta.target === 'single') {
        // handled in else below
    } else {
        // single host result
        Object.entries(results).forEach(([name, data]) => {
            const container = document.getElementById(`result-${name}`);
            if (container) {
                container.innerHTML = '';
                const box = document.createElement('div');
                box.className = 'host-box';
                box.innerHTML = `<strong>Result for ${name} (${data.ip})</strong><pre>${data.output || ''}${data.error ? '\n<span class="error">Error: ' + data.error + '</span>' : ''}</pre>`;
                container.appendChild(box);
            }
        });
    }
});

// Init
window.onload = () => {
    refreshHostsAndTabs();
    openTab(null, 'all');
};
</script>

</body>
</html>
